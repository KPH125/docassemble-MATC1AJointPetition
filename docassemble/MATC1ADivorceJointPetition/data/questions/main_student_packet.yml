id: clinic received file screen
continue button field: clinic_received_file_screen
question: Add a received file
subquestion: |
  Add this file to **${ DOCUMENT_REGISTRY[clinic_active_document_id]["title"] }**.
  The file will not change answers or enter a bundle until the required review
  and verification are complete.
fields:
  - File: clinic_received_files[clinic_upload_key]
    datatype: file
    accept: |
      "application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/png,image/jpeg,.pdf,.doc,.docx,.png,.jpg,.jpeg"
  - What kind of file is this?: clinic_upload_purpose
    input type: radio
    choices:
      - Existing document for reference: existing_reference
      - Client-completed working draft: external_working_draft
      - Client-annotated copy: client_annotated_reference
      - Signed copy: signed_copy
      - Notarized copy: notarized_copy
      - Filed copy: filed_copy
      - Court-returned copy: court_returned_copy
  - How should the clinic use this file?: clinic_upload_disposition
    input type: radio
    choices:
      - Keep it as a reference only: reference_only
      - Review and use this exact file as the working document: use_exact_file
      - Update the interview answers and regenerate the document: update_answers_and_regenerate
      - Not applicable because this is an executed or court-returned copy: not_applicable
  - Date shown on the executed, filed, or returned copy: clinic_upload_event_date
    datatype: date
    required: False
  - Filing method, if applicable: clinic_upload_filing_method
    input type: dropdown
    choices:
      - Not recorded or not applicable: not_recorded
      - Electronic filing: electronic
      - In person: in_person
      - Mail: mail
      - Another method: other
  - Court outcome, if this is a court-returned copy: clinic_upload_court_outcome
    input type: radio
    choices:
      - Not applicable: not_applicable
      - Accepted: accepted
      - Rejected: rejected
      - Follow-up needed: needs_followup
  - Court or clerk note: clinic_upload_court_note
    datatype: area
    rows: 3
    required: False
validation code: |
  if clinic_upload_purpose in (
    "existing_reference",
    "external_working_draft",
    "client_annotated_reference",
  ) and clinic_upload_disposition == "not_applicable":
    validation_error("Choose how the clinic should use the received working file.")
  if clinic_upload_purpose in (
    "signed_copy",
    "notarized_copy",
    "filed_copy",
    "court_returned_copy",
  ) and clinic_upload_disposition != "not_applicable":
    validation_error("Use 'Not applicable' for an executed or court-returned copy.")
  if clinic_upload_purpose == "court_returned_copy" and clinic_upload_court_outcome == "not_applicable":
    validation_error("Record the outcome shown on the court-returned copy.")
  if clinic_upload_purpose != "court_returned_copy" and clinic_upload_court_outcome != "not_applicable":
    validation_error("Record a court outcome only for a court-returned copy.")
