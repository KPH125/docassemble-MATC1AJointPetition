      user_info().id,
    )
  clinic_document_work_in_progress = True
  clinic_document_review_pending = False
  clinic_generation_token = (
    clinic_active_document_id
    + "_"
    + str(len(clinic_matter["activity"]))
    + "_"
    + str(len(clinic_active_document["artifacts"]))
