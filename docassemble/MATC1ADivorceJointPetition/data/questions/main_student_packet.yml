sets: clinic_work_financial_statements
code: |
  if not can_edit_facts(clinic_matter, user_info().id, user_privileges()):
    force_ask("clinic_matter_access_denied")
  users[0].making_statement_for = (
    clinic_matter["documents"]["financial_statement_party_a"]["plan_status"] != "not_selected"
  )
  users[1].making_statement_for = (
    clinic_matter["documents"]["financial_statement_party_b"]["plan_status"] != "not_selected"
  )
  financial_statement_court_division = trial_court.division
  interview_order_financial_statement
  for clinic_party_index, clinic_document_id in (
    (0, "financial_statement_party_a"),
    (1, "financial_statement_party_b"),
  ):
    if clinic_matter["documents"][clinic_document_id]["plan_status"] != "not_selected":
      clinic_financial_artifact = (
        users[clinic_party_index].financial_statement_short_attachment
        if users[clinic_party_index].financial_form_type == "short"
        else users[clinic_party_index].financial_statement_long_attachment
      )
      snapshot_generated_artifact(
        clinic_matter,
        clinic_document_id,
        clinic_financial_artifact,
        clinic_generated_files,
        user_info().id,
        generation_token=clinic_generation_token,
      )
  clinic_work_financial_statements = True
  clinic_document_work_in_progress = False
  clinic_document_review_pending = False
  persist_current_matter_summary(clinic_matter)
  force_ask("clinic_workspace_home")
