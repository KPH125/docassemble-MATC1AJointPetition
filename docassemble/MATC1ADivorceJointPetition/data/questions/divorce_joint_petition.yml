---
#################### Interview order #####################
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_divorcejointpetition
code: |
  # Set the allowed courts for this interview
  allowed_courts = ['Probate and Family Court']
  user_role = "plaintiff"
  user_ask_role = "plaintiff"
  
  nav.set_section("divorce_eligibility")
  legal_marriage
  if legal_marriage == False: 
    cautionary_message_divorce
  
  marriage_certificate_upload
  
  massachusetts_residency
  if massachusetts_residency == False:
    couple_ever_lived_in_massachusetts
    if couple_ever_lived_in_massachusetts == False: 
      cautionary_message_jurisdiction
    elif breakdown_in_massachusetts == False: 
      cautionary_message_jurisdiction
  
  divorce_affirm
  if divorce_affirm == False:
    cautionary_message_divorce_type
  elif joint_petition_affirm == False:
    cautionary_message_divorce_type
  elif notarize_affirm == False:
    cautionary_message_divorce_type

  nav.set_section("separation_agreement")
  # The worksheet path must be settled before the separation agreement
  # format: an agreement built in this tool needs a guideline amount, so
  # that option is hidden when the worksheet is not done yet.
  children_of_marriage
  if children_of_marriage:
    csg_worksheet_path
    if csg_worksheet_path == "wait":
      cautionary_message_delay_csg_worksheet
    elif csg_worksheet_path == "upload":
      child_support_guidelines_worksheet_upload
      set_child_support_defaults_from_uploaded_worksheet
  separation_agreement_reached
  if separation_agreement_reached == True:
    separation_agreement_documented
  elif separation_agreement_reached == False:
    parties_will_negotiate
    if parties_will_negotiate == False:
      cautionary_message_divorce_type
  separation_agreement_format
  if separation_agreement_format == "wait":
    cautionary_message_delay_agreement
  elif separation_agreement_format == "upload":
    separation_agreement_upload
    if children_of_marriage and csg_worksheet_path != "wait":
      uploaded_agreement_addresses_child_support

  nav.set_section("relationship_background")
  marriage_date
  set_marriage_location
  if not international_marriage:
    # The country is only asked for marriages outside the United States, but
    # the late marriage certificate motion reads it either way. Define it here
    # so that motion does not send us back to this screen forever.
    marriage_location_country = ""

  if defined("has_existing_1b_action") and has_existing_1b_action:
    previous_action = True
    previous_action_detail = f"1B Divorce Complaint, Docket No. {docket_number}, filed {action_commenced_date.format()}"
  else:
    previous_action
    if previous_action == True:
      previous_action_detail

  marital_home.zip
  who_lives_at_marital_home
  copy_marital_address_fields

  nav.set_section("party_information")

  if ask_party_a_address:
    users[0].address.address
  users[0].phone_number
  if ask_party_b_address:
    users[1].address.address
  users[1].phone_number

  users.gather()
  set_parts(subtitle=str(users))
  
  nav.set_section("children_information")
  if children_of_marriage:
    children.gather()
    set_parts(subtitle=str(children))
    users1_number_of_custodial_children
  nav.set_section("court_requests")  
  if separation_agreement_format != "interview":
    request_merge_agreement
    request_survive_agreement
  users[0].name_change
  additional_request
  
  set_progress(80)
 
  nav.set_section("additional_circumstances_and_filings")


  set_progress(90)
  nav.set_section("review_and_sign")

  set_default_petition_values
  
  interview_order_divorcejointpetition = True
---
terms:
  separation agreement: |
    A written document listing all things the parties agree on in their divorce, like child support, taxes, parenting time, and property division
  notary: |
    A notary or notary is authorized by the Commonwealth of Massachusetts to witnes signatures, among other possible duties. 
  notarize: |
    The process where a notary public witnesses signatures and places a seal on document to ensure authenticity
  notarized: |
    A document that has been signed in the presence of a notary public and the notary has placed their seal upon it
  children of the marriage: |
    Children of the marriage includes all children over whom the couple shares legal custody. This typically includes all children born to either spouse during the marriage and any other children legally adopted by one or both parents but not include step-children born or adopted to one spouse outside of the marriage and not legally adopted by the second spouse.
  child support guidelines: |
    Mathematical formula used by the court to determine an appropriate amount of child support  
  marital home: |
   The last residential address shared by divorcing parties
  financial statement: |
    A form summarizing a party's estimated income and expenses, assets, liabilities, and health insurance, etc. 
  divorce absolute: |
    The date a divorce becomes final
  both: |
    Some items or provisions will merge while others will survive. The separation agreement should clearly indicate which provisions will merge and which will survive. 
---
id: Joint 1A Divorce Intro
continue button field: divorcejointpetition_intro
question: |
   **Joint petition for divorce under [G.L. c. 208, § 1A](https://malegislature.gov/Laws/GeneralLaws/PartII/TitleIII/Chapter208/Section1a)**
subquestion: |
    This interview helps both spouses prepare a packet for a joint divorce. This is called a 1A divorce.

    It asks about your marriage, your agreement, and any children.

    **Before you begin, gather these documents and details.**

    1. A copy of your marriage certificate, if you have one
    2. Your separation agreement, if you have one
    3. Names, birth dates, and addresses for both spouses and any children under 18
    4. Pay stubs and details about your income and costs, if you want financial forms

    **At the end**

    You can download your papers. The last screen tells you what to do before you file.

