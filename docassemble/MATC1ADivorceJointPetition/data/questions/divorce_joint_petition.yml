id: child support guidelines worksheet status
question: |
  Child support guidelines worksheet
subquestion: |
  Because you have {children of the marriage}, the court requires a completed
  [Child Support Guidelines Worksheet (CJD 304)](https://www.mass.gov/info-details/probate-and-family-court-2025-child-support-guidelines-worksheet-cjd-304),
  even if you agree to waive child support. The worksheet uses the {child support guidelines} to calculate a weekly support amount.
fields:
  - "How would you like to handle the worksheet?": csg_worksheet_path
    input type: radio
    choices:
      - "Fill out the worksheet using this interview tool": interview
      - "Upload my completed worksheet now": upload
      - "File it with the court registry later": wait
---
id: upload child support guidelines worksheet
question: |
  Upload child support guidelines worksheet
subquestion: |
  Upload your completed Child Support Guidelines Worksheet (CJD 304). We cannot read the numbers from the file automatically, so also tell us the result from your worksheet.
fields:
  - "Upload completed worksheet": child_support_guidelines_worksheet_upload
    datatype: file
  - "Weekly child support amount calculated by the worksheet": uploaded_worksheet_guideline_amount
    datatype: currency
    min: 0
  - "Who would pay child support (the payor)?": uploaded_worksheet_payor
    input type: radio
    choices:
      - "${ users[0] }": party_a
      - "${ users[1] }": party_b
---
