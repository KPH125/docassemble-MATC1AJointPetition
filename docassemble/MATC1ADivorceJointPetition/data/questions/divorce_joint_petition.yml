sets:
  users[1].name.first
question: |
  Spouse name
subquestion: |
  Who is married to ${  users[0].name_full()  }?
fields:
  - code: |
      users[1].name_fields()  
---
id: Party A Phone number
sets:
  users[0].phone_number
question: |
  What is ${  users[0]  }'s phone number?
fields:
  - "${ users[0]  } phone number": users[0].phone_number
    datatype: tel
---
id: Party B Phone number
sets:
  users[1].phone_number
question: |
  What is ${  users[1]  }'s phone number?
fields:
  - "${ users[1]  } phone number": users[1].phone_number
    datatype: tel
---
id: legal marriage
question: |
  Confirm legal marriage
fields: 
  - "Are ${  users[0].name_full()  } and ${  users[1].name_full()  } legally married?" : legal_marriage
    datatype: yesnoradio
---
id: upload marriage proof
question: |
  Upload marriage certificate
subquestion: |
  Submitting a certified copy of your marriage certificate is strongly encouraged at the time of initial filing. Upload a copy here to include it with your filings. Keep any original copies as the court may ask for a physical certified copy. 
  
fields:
  - "Upload marriage certificate": marriage_certificate_upload
    datatype: file
    required: False
under: |
  This document will likely need to be filed before the court can give you a hearing date or hear your case.
---
id: cautionary message legal marriage
question: Legal marriage
subquestion: |
  You must be legally married in order to be granted a divorce in Massachusetts. 

sets: cautionary_message_divorce
buttons: 
  - Keep going: 
      code: |
        cautionary_message_divorce = True
  - Restart: restart
  - Exit: exit
---
id: Confirm Massachusetts jurisdiction A
question: |
  Massachusetts jurisdiction confirmation
fields:
  - "Have either or both ${ users[0] } and ${ users[1] } lived in Massachusetts for at least one year?": massachusetts_residency
    datatype: yesnoradio
---
id: Confirm Massachusetts jurisdiction B
question: |
  Massachusetts jurisdiction confirmation
fields:
  - "Did ${ users[0] } and ${ users[1] } ever live in Massachusetts while you were married?": couple_ever_lived_in_massachusetts
    datatype: yesnoradio
  - "Did the cause for the divorce happen in Massachusetts?": breakdown_in_massachusetts
    datatype: yesnoradio
---
id: Cautionary message jurisdiction
question: |
  Eligibility for Divorce in Massachusetts
subquestion: |
  You can file for divorce in Massachusetts if:
  
  * You've lived in the state for 1 year, or;
  * The reason the marriage ended happened in Massachusetts and you've lived in the state as a couple
  
  If you remain unsure whether you are eligible for divorce in Massachusetts, you may wish to speak to an attorney licensed to practice in Massachusetts to discuss your options. 
sets: cautionary_message_jurisdiction  
buttons: 
  - Keep going: 
      code: |
        cautionary_message_jurisdiction = True
  - Restart: restart
  - Exit: exit
---
id: Divorce type
question: |
  Is a 1A divorce right for you?
subquestion: |
  A joint petition, or "1A," is a no-fault divorce that both spouses file
  together. It asks you to file a notarized {separation agreement}, either when
  you file or within 90 days.

  **All three statements below must be true to file a 1A divorce.** Check each
  one that is true for ${ users[0].familiar() } and ${ users[1].familiar() }.
  Leave a box unchecked if it is not true — the next screen explains your options.
fields:
  - no label: divorce_type_affirmations
    datatype: checkboxes
    choices:
      - "We both want to get divorced": want_divorce
      - "We both want to file together (jointly)": file_jointly
      - "We will file a notarized separation agreement, at filing or within 90 days": will_notarize
    none of the above: False
under: |
  [**Which type of divorce should I file?**](https://www.mass.gov/decision-tree/which-type-of-divorce-should-i-file)

  [**G.L. c. 208, § 1A**](https://malegislature.gov/Laws/GeneralLaws/PartII/TitleIII/Chapter208/Section1a)
---
comment: |
  The three statements are collected as one checkbox list so they render as a
  full width list instead of being squeezed into the input column. The
  eligibility logic still reads them one at a time.
code: |
  divorce_affirm = divorce_type_affirmations["want_divorce"]
  joint_petition_affirm = divorce_type_affirmations["file_jointly"]
  notarize_affirm = divorce_type_affirmations["will_notarize"]
---
id: Cautionary message divorce type
question: |
  A 1A divorce may not fit
subquestion: |
  % if not divorce_affirm:
  You did not check that you both want to get divorced.
  % endif
  % if not joint_petition_affirm:
  You did not check that you both want to file together.
  % endif
  % if not notarize_affirm:
  You did not check that you will file a notarized separation agreement.
  % endif
  % if divorce_affirm and joint_petition_affirm and notarize_affirm:
  You said you are not willing to work out an agreement together.
  % endif

  To file a 1A divorce, all of these must be true. A 1A divorce is for couples who
  agree about ending the marriage, and who agree about how to handle money,
  property, and children.

  **Did you mean to check that box?** Choose **Undo** below to go back and change
  your answer.

  **Is your answer right?** Then you may need a different kind of divorce. A 1B
  divorce is for couples who do not agree, or who are not ready to file an
  agreement. You can keep going here, but the court may not accept your papers.
sets: cautionary_message_divorce_type
buttons:
  - Keep going:
      code: |
        cautionary_message_divorce_type = True
  - Start over: restart
  - Exit: exit
under: |
  [**Which type of divorce should I file?**](https://www.mass.gov/decision-tree/which-type-of-divorce-should-i-file)
---
id: Agreement on major issues
question: | 
  Agreement on major issues
subquestion: |
  You will need to explain to the court how you will handle any issues related to your divorce. 
  These issues may include:
  
  
  * Child support
  * Parenting time
  * Child custody
  * Alimony
  * Dividing shared property (marital assets)
  * Health insurance 
  
  **Do ${  users[0].name_full()  } and ${  users[1].name_full()  } agree on how to resolve all major issues, such as property division, child custody, and child support?**
fields: 
  - "We agree on the major issues": separation_agreement_reached
    datatype: yesnoradio
---
id: Willing to negotiate agreement
question: |
  Willingness to negotiate agreement
subquestion: |
  Are ${  users[0].name_full()  } and ${  users[1].name_full()  } willing to work together to come to agreement on how you will handle any issues related to your divorce? 

  These issues may include:
  
  * Child support
  * Parenting time
  * Child custody
  * Alimony
  * Dividing shared property (marital assets)
  * Health insurance 

  There are different ways to reach an agreement. Some negotiate on their own while others hire lawyers. Some use mediators to help settle the issues.
  
  [Alternative Dispute Resolution](https://www.mass.gov/alternative-dispute-resolution) options may be available. 
  
fields: 
  - "We will work together to come to agreement": parties_will_negotiate
    datatype: yesnoradio
under: |  
  If both parties are willing to work together, this interview can help you create a separation agreement, upload one you already have, or continue with a plan to file it later.
---
depends on: 
  - separation_agreement_reached
code: |
  if separation_agreement_reached == False:
    separation_agreement_documented = False
---
id: Separation agreement status
question: |
  Separation agreement
subquestion: |
  Your separation agreement tells the court how you will handle property, custody, and support. It must be {notarized} within 90 days of filing and should be filed with your initial petition.
  % if children_of_marriage and csg_worksheet_path == "wait":

  Because your child support guidelines worksheet is not done yet, this tool cannot create a separation agreement for you. The agreement must state a child support guideline amount, and that amount comes from the worksheet.
  % endif
fields:
  - "Have you already prepared a separation agreement?": separation_agreement_documented
    datatype: yesnoradio
  - "How would you like to proceed?": separation_agreement_format
    input type: radio
    show if: separation_agreement_documented
    choices:
      - "Upload my complete, notarized agreement now": upload
      - "File it with the court registry later": wait
  - "How would you like to proceed?": separation_agreement_format
    input type: radio
    show if:
      variable: separation_agreement_documented
      is: False
    code: |
      separation_agreement_format_options
---
depends on:
  - children_of_marriage
  - csg_worksheet_path
code: |
  # An agreement built in this tool always asks for a child support
  # guideline amount, which does not exist until the worksheet is
  # completed or uploaded.
  if children_of_marriage and csg_worksheet_path == "wait":
    separation_agreement_format_options = [
      {"label": "File something with the court registry later", "value": "wait"},
    ]
  else:
    separation_agreement_format_options = [
      {"label": "Create one using this interview tool", "value": "interview"},
      {"label": "File something with the court registry later", "value": "wait"},
    ]
---
