subquestion: |
  You have indicated that you have not completed a child support guidelines worksheet yet. Confirm that you understand:

  * You must complete and file a Child Support Guidelines Worksheet (CJD 304) before the court can approve your divorce
  * Because there is no guideline amount yet, this tool cannot build your separation agreement or the Findings and Determinations form (CJD 305)
  * If your agreement sets a child support amount different from the worksheet's guideline amount — including waiving child support — you must also complete and file the Findings and Determinations form (CJD 305)
