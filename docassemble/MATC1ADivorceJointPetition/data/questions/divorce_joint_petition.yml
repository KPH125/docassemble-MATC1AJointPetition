---
comment: |
  Helpers for working out which county the divorce can be filed in.
  The county field on our address questions is optional, and most people in
  Massachusetts do not know their county, so fall back to geocoding. When we
  still cannot tell, these return "" and the interview asks the parties to
  choose rather than guessing.
code: |
  def venue_county_of(address):
    county = str(showifdef(address.attr_name("county"), "")).strip()
    if not county:
      try:
        address.geocode()
      except:
        pass
      county = str(showifdef(address.attr_name("county"), "")).strip()
    if county.lower() in ("", "unknown"):
      return ""
    return county

  def venue_county_key(address):
    return venue_county_of(address).lower().replace("county", "").strip()

  def venue_in_massachusetts(address):
    state = str(showifdef(address.attr_name("state"), "")).strip().lower()
    return state in ("ma", "mass", "massachusetts")

  def venue_county_label(address):
    county = venue_county_of(address)
    if not county:
      return str(showifdef(address.attr_name("city"), "where they live"))
    if county.lower().endswith("county"):
      return county
    return county + " County"
---
comment: |
  Venue for a 1A divorce.

  If either spouse still lives in the marital home, the case belongs in the
  county of the marital home. Otherwise it can be filed in any Massachusetts
  county where either spouse lives, unless one of them still lives in the
  marital home's county, which brings venue back to the marital home's county.

  Only one address is searched, so the court lookup can geocode it and match a
  single county instead of merging courts from several counties.
code: |
  # Force the addresses to exist before comparing them, so a half-gathered
  # address cannot send us back through this block.
  marital_home.address
  [user.address.address for user in users.complete_elements()]

  venue_party_counties = set(
    venue_county_key(user.address)
    for user in users.complete_elements()
    if venue_in_massachusetts(user.address) and venue_county_key(user.address)
  )
  venue_marital_home_county = (
    venue_county_key(marital_home) if venue_in_massachusetts(marital_home) else ""
  )
  # The marital home's county is a venue only while someone still lives there,
  # or while a spouse lives in that same county. Otherwise it is not offered.
  venue_marital_home_proper = venue_in_massachusetts(marital_home) and (
    who_lives_at_marital_home != "neither"
    or (venue_marital_home_county and venue_marital_home_county in venue_party_counties)
  )

  venue_candidates = []
  if venue_marital_home_proper:
    venue_candidates.append(("marital_home", marital_home))
  if venue_in_massachusetts(users[0].address):
    venue_candidates.append(("party_a", users[0].address))
  if venue_in_massachusetts(users[1].address):
    venue_candidates.append(("party_b", users[1].address))

  # One entry per county. The marital home is first, so when a spouse still
  # lives in its county the two collapse into the marital home's entry.
  venue_options = []
  venue_seen_counties = set()
  for venue_key, venue_candidate in venue_candidates:
    venue_candidate_county = venue_county_key(venue_candidate)
    if venue_candidate_county and venue_candidate_county in venue_seen_counties:
      continue
    if venue_candidate_county:
      venue_seen_counties.add(venue_candidate_county)
    venue_options.append((venue_key, venue_candidate))

  venue_addresses_by_key = dict(venue_options)

  # The county the venue rules point to. It is preselected, not forced, so the
  # parties can change it when they know something we do not.
  if "marital_home" in venue_addresses_by_key:
    venue_default = "marital_home"
  elif venue_options:
    venue_default = venue_options[0][0]
  else:
    venue_default = "marital_home"

  venue_choice_list = []
  for venue_key, venue_candidate in venue_options:
    if venue_key == "marital_home":
      venue_where = "where your marital home is"
    elif venue_key == "party_a":
      venue_where = "where " + str(users[0]) + " lives"
    else:
      venue_where = "where " + str(users[1]) + " lives"
    venue_choice_list.append(
      {
        "label": venue_county_label(venue_candidate) + " — " + venue_where,
        "value": venue_key,
      }
    )
---
