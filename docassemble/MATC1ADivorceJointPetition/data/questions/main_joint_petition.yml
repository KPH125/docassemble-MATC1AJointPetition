template: financial_statement_decision_help
subject: |
  How to decide about financial statements
content: |
  You do **not** have to file financial statements with your initial Joint Petition (1A).

  Best practice is to file a signed financial statement for each spouse before your case is scheduled.

  Financial statements are signed under penalty of perjury, so accuracy matters. The court relies on these forms when making decisions. If your circumstances change, you must file an updated financial statement accordingly.

  Under **Supplemental Probate and Family Court Rule 401**, each party in a divorce must file a signed financial statement within **45 days after service of summons**, or sooner if a hearing or pretrial conference is scheduled.
---
id: joint petition interview order
code: |
  combined_bundle_documents_normalized
  nav.set_section("convert_1b_to_1a")
  has_existing_1b_action
  if has_existing_1b_action:
    combined_interview_order_motion_to_amend

  nav.set_section("packet_options")
  include_financial_statement

  interview_order_divorcejointpetition

  nav.set_section("court_requests")
  trial_court
  # Always show the court, even when the venue rules left no choice to make.
  trial_court_confirmed
  set_trial_court_division
  include_r408 = not has_existing_1b_action
  if include_r408:
    interview_order_r408

  needs_late_marriage_certificate_motion = not bool(marriage_certificate_upload)
  if needs_late_marriage_certificate_motion:
    interview_order_jointmotiontofilemarriagecertificatelate

  include_care_or_custody_affidavit = children_of_marriage
  if include_care_or_custody_affidavit:
    set_care_or_custody_affidavit_defaults
    nav.set_section("care_or_custody_affidavit_children")
    interview_order_affidavit_disclosing_care_or_custody_children
    nav.set_section("care_or_custody_affidavit_cases")
    interview_order_affidavit_disclosing_care_or_custody_cases
    nav.set_section("care_or_custody_affidavit_addresses")
    interview_order_affidavit_disclosing_care_or_custody_addresses
    trigger_aff_care_or_custody_computed_variables

  include_child_support_guidelines_worksheet = (
    children_of_marriage and csg_worksheet_path == "interview"
  )
  if include_child_support_guidelines_worksheet:
    set_child_support_guidelines_defaults
    nav.set_section("child_support_guidelines")
    ma_child_support_guidelines_worksheet_intro
    interview_order_ma_child_support_guidelines_worksheet
    set_child_support_defaults_from_guidelines
    child_support_guidelines_result_reviewed

  include_separation_agreement = separation_agreement_format == "interview"

  if include_financial_statement:
    nav.set_section("financial_statement")
    financial_statement_court_division = trial_court.division
    interview_order_financial_statement

  if include_separation_agreement:
    # The parent interview has already collected this shared child information.
    has_children = children_of_marriage
    if has_children:
      children.target_number = len(children)
    interview_order_a_divorce_agreement

  set_petition_merger_survival_values

  # Findings and Determinations (CJD 305) is only needed when the parties
  # deviate from the child support guidelines amount. Waiving support is a
  # deviation down to $0. With no completed worksheet or no agreement yet,
  # there is no guideline amount or agreed amount to compare.
  if not children_of_marriage or csg_worksheet_path == "wait" or separation_agreement_format == "wait":
    include_findings_and_determinations = False
  elif separation_agreement_format == "interview":
    include_findings_and_determinations = child_support_deviation
  else:
    include_findings_and_determinations = (
      uploaded_agreement_addresses_child_support
      and uploaded_agreement_child_support_deviation
    )

  if include_findings_and_determinations:
    set_findings_and_determinations_defaults
    nav.set_section("child_support_findings")
    cjd_305_intro
    interview_order_cjd_305

  nav.set_section("fee_waiver")
  set_indigency_defaults
  ask_if_qualifies_for_fee_waiver
  if ask_if_qualifies_for_fee_waiver:
    ask_affidavit_questions

  joint_petition_interview_order = True
---
comment: |
  The standalone motion interview swaps users.elements when the original 1B
  plaintiff should be Party B. Moving ALIndividual objects between DAList
  indices leaves their instance names pointing at the old indices and caused a
  certified al_court_bundle assembly cycle. In the combined interview the
  parent owns this integration order. Swap only the already-collected name
  values, before collecting every remaining party attribute, so each object
  keeps its canonical users[0]/users[1] identity.
id: combined interview order motion to amend
code: |
  allowed_courts = ['Probate and Family Court']
  user_role = "plaintiff"
  user_ask_role = "plaintiff"

  users[0].name.first
  users[1].name.first
  plaintiff_is_party_a
  if not plaintiff_is_party_a:
    users[0].name.first, users[1].name.first = users[1].name.first, users[0].name.first
    users[0].name.middle, users[1].name.middle = users[1].name.middle, users[0].name.middle
    users[0].name.last, users[1].name.last = users[1].name.last, users[0].name.last
    users[0].name.suffix, users[1].name.suffix = users[1].name.suffix, users[0].name.suffix
    plaintiff_index = 1
  else:
    plaintiff_index = 0
  defendant_index = 1 - plaintiff_index

  trial_court.division
  docket_number
  set_progress(30)
  marriage_breakdown_date
  breakdown_location
  action_commenced_date
  set_progress(50)

  users[0].has_attorney
  if users[0].has_attorney:
    attorneys[0].name_fields()
    attorneys[0].address_fields()
    attorneys[0].phone_number
    attorneys[0].bbo_number
  else:
    users[0].phone_number

  set_progress(70)
  users[1].has_attorney
  if users[1].has_attorney:
    attorneys[1].name_fields()
    attorneys[1].address_fields()
    attorneys[1].phone_number
    attorneys[1].bbo_number
  else:
    users[1].phone_number

  set_progress(90)
  if plaintiff_index == 0:
    if not users[0].has_attorney:
      users[0].signature
    if not users[1].has_attorney:
      users[1].signature
    else:
      attorneys[1].signature
  else:
    if not users[1].has_attorney:
      users[1].signature
    if not users[0].has_attorney:
      users[0].signature
    else:
      attorneys[0].signature

  combined_interview_order_motion_to_amend = True
